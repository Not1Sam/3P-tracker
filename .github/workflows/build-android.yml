name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'EAS build profile'
        required: false
        default: 'preview'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build APK (cloud)
        run: |
          PROFILE="${{ github.event.inputs.build_profile || 'preview' }}"
          RESULT=$(eas build --platform android --profile "$PROFILE" --non-interactive --json)
          echo "$RESULT" > build-result.json
          ARTIFACT_URL=$(echo "$RESULT" | jq -r '.[0].artifacts.applicationArchiveUrl')
          echo "ARTIFACT_URL=$ARTIFACT_URL" >> $GITHUB_ENV
          echo "Built APK: $ARTIFACT_URL"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        run: curl -L -o tracker.apk "$ARTIFACT_URL"

      - name: Upload to GitHub Release
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "" ] || [ "$TAG" = "refs/tags/" ]; then
            TAG="manual"
          fi
          gh release upload "$TAG" tracker.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
