name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'EAS build profile'
        required: false
        default: 'preview'

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      ANDROID_HOME: /home/ubuntu/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
      
      - name: Setup native CMake for ARM64
        run: |
              mkdir -p $ANDROID_HOME/cmake/3.22.1/bin
              ln -sf /usr/bin/cmake $ANDROID_HOME/cmake/3.22.1/bin/cmake
              ln -sf /usr/bin/ninja $ANDROID_HOME/cmake/3.22.1/bin/ninja

      - name: Build APK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH
          PROFILE="${{ github.event.inputs.build_profile || 'preview' }}"
          eas build --platform android --profile "$PROFILE" --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name || 'manual' }}
          path: "*.apk"
          retention-days: 30
          if-no-files-found: error
