server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html — always fresh, preload critical assets
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Link "</_expo/static/js/web/entry-*.js>; rel=preload; as=script" always;
    }

    # Service worker — never cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Workbox JS — never cache
    location = /workbox-404ad025.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Manifest — short cache
    location = /manifest.json {
        add_header Cache-Control "max-age=3600";
    }

    # Static assets with hashed filenames — immutable cache
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Font files — immutable cache (versioned paths from expo)
    location ~* \.(ttf|woff|woff2|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Images and icons — long cache
    location ~* \.(png|ico|svg|jpg|jpeg|gif|webp)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # gzip — aggressive compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml
        image/x-icon;
}
